[package]
name = "the-pit"
version = "0.1.0"
description = "PIT — Private Instant Trading: competitive trading arenas on MagicBlock"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "the_pit"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
# Pinned to match anchor-lang: a caret resolution pulls anchor-syn 1.2.x, whose
# generated code references system_program items that 1.0.2 does not export.
anchor-syn = "=1.0.2"
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "access-control", "vrf"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
